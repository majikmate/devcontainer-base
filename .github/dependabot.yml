version: 2
updates:
  # New major versions of the features (minor and patch versions are
  # installed automatically, because the features are pinned by major version)
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "feat(devcontainer)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
