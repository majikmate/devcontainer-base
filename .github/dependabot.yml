# Weekly updates of the GitHub actions and the base image.
# The tools in the image (Go, Node.js, Deno, ...) are not updated here: the
# release workflow checks their newest versions every night.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
