# Manual run: lists (report) or deletes (apply) the outdated versions of the
# image package of this repository. The logic is in the shared workflow of
# devcontainer-core:
# https://github.com/majikmate/devcontainer-core/blob/main/.github/workflows/devcontainer-prune.yml
#
# Scope "outdated" uses the same rules as the release workflow after every
# run (releases older than 90 days); "all-but-newest" deletes every release
# of the current major line except the newest (a one-time clean-up).
name: Prune

on:
  workflow_dispatch:
    inputs:
      mode:
        description: report (list only) or apply (delete; this cannot be undone)
        type: choice
        options: [report, apply]
        default: report
      scope:
        description: outdated (older than 90 days, older major versions, unused) or all-but-newest
        type: choice
        options: [outdated, all-but-newest]
        default: outdated

jobs:
  prune:
    uses: majikmate/devcontainer-core/.github/workflows/devcontainer-prune.yml@main
    permissions:
      packages: write
    with:
      mode: ${{ inputs.mode }}
      scope: ${{ inputs.scope }}
      # the same major version as in release.yml
      major-version: 2
