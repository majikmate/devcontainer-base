# Builds, tests and releases ghcr.io/majikmate/devcontainer-base.
# The logic is in the shared workflow of devcontainer-core:
# https://github.com/majikmate/devcontainer-core/blob/main/.github/workflows/devcontainer-image.yml
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Nightly check, two hours after devcontainer-core (23:17 UTC): a new core
  # image leads to a new release. The images that build on this image run
  # their check two hours later.
  schedule:
    - cron: "17 1 * * *"
  # Manual check ("Run workflow"): first brings devcontainer-core up to date
  # (option upstream), then runs the same check as the nightly run
  workflow_dispatch:
    inputs:
      upstream:
        description: First update the upstream images (run the Release workflow of devcontainer-core and wait for it)
        type: boolean
        default: true
      force:
        description: Release a new version even if no input changed
        type: boolean
        default: false
      bump:
        description: Version step
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# One release at a time; pull requests cancel their older runs
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    uses: majikmate/devcontainer-core/.github/workflows/devcontainer-image.yml@main
    permissions:
      contents: write
      packages: write
      actions: write
    # GitHub App that starts the Release workflow of devcontainer-core (manual chain build)
    secrets:
      app-client-id: ${{ secrets.DEVCONTAINER_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.DEVCONTAINER_APP_PRIVATE_KEY }}
    with:
      image-title: DevContainer Base Environment
      image-description: Base Dev Container based on Debian 13 (trixie) with Go, Node.js LTS, Deno LTS, Prettier and common development tools
      # Increase together with a breaking change (for example a new Debian release)
      major-version: 2
      # The image in the FROM line of .devcontainer/Dockerfile
      upstream-repositories: devcontainer-core
      update-upstream: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream == true }}
      force: ${{ inputs.force || false }}
      bump: ${{ inputs.bump || 'auto' }}
